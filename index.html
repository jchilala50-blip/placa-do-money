    async function processarAcao() {
        const nome = document.getElementById('campo-nome').value;
        const email = document.getElementById('campo-email').value;
        const senha = document.getElementById('campo-senha').value;

        const rota = modoCadastro ? '/registrar' : '/login';
        const corpoDados = modoCadastro ? { nome, email, senha } : { email, senha };

        try {
            const resposta = await fetch(`${API_URL}${rota}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(corpoDados)
            });

            const resultado = await resposta.json();

            if (!resposta.ok) {
                alert(resultado.erro || "Ocorreu um erro no servidor.");
                return;
            }

            alert(resultado.mensagem);

            if (!modoCadastro) {
                carregarTelaDeriv();
            } else {
                alternarTela();
            }

            alert("Erro físico ao tentar alcançar o servidor.");

async function conectarViaOAuth() {
    try {

        const dados = await resposta.json();
        if (dados.url) {
            window.location.href = dados.url; // Redireciona para a Deriv

            Console.log("Erro ao obter URL de autenticação.");
        }
    } catch (erro) {
        console.error(erro);
        alert("Erro ao conectar com o servidor local.");
    }
}

// === FUNÇÃO PARA COMPRAR CONTRATO REAL NA DERIV (API v3) ===
function comprarContratoDeriv(tipoContrato, duracaoTicks, barreira) {
console.log("ENTREI EM comprarContratoDeriv");
console.log("WS STATE: " + window.derivWS.readyState);

    if (!window.derivWS || window.derivWS.readyState !== 1) {
        console.log("Erro: WebSocket não está conectado!");
        return;
    }

    const stake = document.getElementById('config-stake') ? Number(document.getElementById('config-stake').value) : 0.35;

operacaoAtual.preco = stake;

    // Formato oficial da API Deriv para solicitar um contrato (Proposal)
    const requisicaoProposal = {
        "proposal": 1,
        "req_id": 1001,
        "amount": stake,
        "basis": "stake",
        "contract_type": tipoContrato,
        "currency": "USD",
        "duration": Number(duracaoTicks),
        "duration_unit": "t",
    "underlying_symbol": typeof simboloAtual !== 'undefined' ? simboloAtual : '1HZ100V'
    };

    if (barreira !== undefined) {
        requisicaoProposal.barrier = String(barreira);
    }

   window.ultimaMensagem = requisicaoProposal;
    window.derivWS.send(JSON.stringify(requisicaoProposal));
}

function validarStake() {
    const input = document.getElementById('config-stake');
    if (!input) return;

    let valor = parseFloat(input.value);

    if (isNaN(valor) || valor < 0.35) {
        input.value = 0.35;
        return;
    }

    // opcional: arredondar sempre para 2 casas
    input.value = valor.toFixed(2);
}

document.getElementById('config-stake').addEventListener('blur', validarStake);

// === MOTOR DE PROCESSAMENTO DAS 5 ESTRATÉGIAS ===

function executarMotorEstrategias(ultimoDigito, tickId) {

    if (tickId === ultimoTickProcessado) return;

    ultimoTickProcessado = tickId;

console.log("MOTOR: " + ultimoDigito);

    if (operacaoAtual.ativa) return;

const estrategia = document.getElementById('estrategia-robo').value;

if (estrategia === 'nenhuma') return;


console.log(`Robô analisando dígito [${ultimoDigito}] na estratégia: ${estrategia}`);


    // 1. ESTRATÉGIA ÍMPAR
    if (estrategia === 'impar' && ultimoDigito % 2 !== 0) {
        operacaoAtual = {
    ativa: true,
    tipo: "ÍMPAR",
    preco: 0.35,
    tickEntrada: ultimoDigito,
    proposalId: null,
    contractId: null,
    aguardandoResultado: true
};

comprarContratoDeriv('DIGITODD', 5);
    }
    
   // 2. ESTRATÉGIA PAR
else if (estrategia === 'par' && ultimoDigito % 2 === 0) {

    operacaoAtual = {
        ativa: true,
        tipo: "PAR",
        preco: 0.35,
        tickEntrada: ultimoDigito,
        proposalId: null,
        contractId: null,
        aguardandoResultado: true
    };

    comprarContratoDeriv('DIGITEVEN', 5);
}

    // 3. ESTRATÉGIA OVER
else if (estrategia === 'over' && ultimoDigito > 5) {

    operacaoAtual = {
        ativa: true,
        tipo: "OVER 5",
        preco: 0.35,
        tickEntrada: ultimoDigito,
        proposalId: null,
        contractId: null,
        aguardandoResultado: true
    };

    comprarContratoDeriv('DIGITOVER', 5, 5);
}

    // 4. ESTRATÉGIA UNDER
else if (estrategia === 'under' && ultimoDigito < 5) {

    operacaoAtual = {
        ativa: true,
        tipo: "UNDER 5",
        preco: 0.35,
        tickEntrada: ultimoDigito,
        proposalId: null,
        contractId: null,
        aguardandoResultado: true
    };

    comprarContratoDeriv('DIGITUNDER', 5, 5);
}

    // 5. ESTRATÉGIA REPETIÇÃO
    else if (estrategia === 'repeticao') {
        // Precisamos de pelo menos dois dígitos no histórico para comparar
        if (ultimosDigitos.length >= 2) {
            const penultimoDigito = ultimosDigitos[ultimosDigitos.length - 2];
            
            if (ultimoDigito === penultimoDigito) {
                console.log(`Dígito repetido detetado! [${ultimoDigito} = ${penultimoDigito}]`);
                operacaoAtual = {

function atualizarCoresBarras(contagem) {


const total =

ultimosDigitos.length;


for(let i = 0; i <= 9; i++) {


const barra =

document.getElementById(`barra-${i}`);


if(!barra) continue;


const percentual =

total > 0

? Math.round(

(contagem[i] / total) * 100

)

: 0;


if(percentual >= 15) {


barra.style.backgroundColor =

"#00e676";


} else if(percentual >= 8) {


barra.style.backgroundColor =

"#ffffff";


} else {


barra.style.backgroundColor =

"#ff1744";

}

}

}


function atualizarGraficoReal() {

const contagem = Array(10).fill(0);


ultimosDigitos.forEach(digito => {

if (!isNaN(digito) && digito >= 0 && digito <= 9) {

contagem[digito]++;

}

});


atualizarCoresBarras(contagem);


for (let i = 0; i <= 9; i++) {

const barra = document.getElementById(`barra-${i}`);

const texto = document.getElementById(`perc-${i}`);


const percentual = ultimosDigitos.length > 0 ? Math.round(

(contagem[i] / ultimosDigitos.length) * 100

) : 0;


if (barra) {


let altura = percentual * 3.0;


if (altura > 80) {

altura = 80;

}


barra.style.height =

Math.max(altura, 10) + "px";

}


if (texto) {

texto.innerText = percentual + "%";

}

}

}

// === PROCESSAR PLACAR E LIBERTAR O ROBÔ ===
function processarResultadoOperacao(resultado, lucro, ultimoDigitoReal) {
alert("ENTREI EM processarResultadoOperacao");

    // CORRIGIDO: ID exato conforme o HTML do Bloco 1
    const winsElem = document.getElementById('cont-wins');
    const lossesElem = document.getElementById('cont-losses'); 

    const isWin = resultado === true || resultado === 'won';

    if (isWin) {
        lucroVirtual += Number(lucro);
        if (winsElem) {
            winsElem.innerText = Number(winsElem.innerText) + 1;
        }
        atualizarEtapas(2);
    } else {
        perdaVirtual += Math.abs(Number(lucro));
        if (lossesElem) {
            lossesElem.innerText = Number(lossesElem.innerText) + 1;
        }
        atualizarEtapas(3);
    }

    // Exibe o lucro real formatado no painel superior
    const lucroRealElem = document.getElementById('lucro-real');
    if (lucroRealElem) {
        const saldoFormatado = (lucroVirtual - perdaVirtual).toFixed(2);
        lucroRealElem.innerText = `$ ${saldoFormatado}`;
        lucroRealElem.style.color = (lucroVirtual - perdaVirtual) >= 0 ? "#00e676" : "#ff1744";
    }

    // CORRIGIDO: Agora grava o dígito real de saída obtido da Deriv!
    historicoOperacoes.unshift({
        tipo: operacaoAtual ? operacaoAtual.tipo : "-",
        ultimo: ultimoDigitoReal, // Mudado aqui!
        preco: operacaoAtual ? operacaoAtual.preco : 0,
        resultado: isWin ? "WIN" : "LOSS",
        lucro: Number(lucro).toFixed(2),
        hora: new Date().toLocaleTimeString()
    });

    if (historicoOperacoes.length > 20) {
        historicoOperacoes.pop();
    }

    if (typeof renderizarHistorico === 'function') {
        renderizarHistorico();
    }

    operacaoAtual = {
    ativa: false,
    tipo: "",
    preco: 0,
    tickEntrada: null,
    proposalId: null,
    contractId: null,
    aguardandoResultado: false
};

}
